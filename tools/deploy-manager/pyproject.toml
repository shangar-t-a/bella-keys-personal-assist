[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bella-deploy-manager"
version = "1.0.0"
description = "Cross-platform production deployment and container lifecycle manager for Bella Keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
bella-deploy = "bella_deploy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bella_deploy"]
